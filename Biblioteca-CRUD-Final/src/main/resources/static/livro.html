<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Livro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="wrap">
        <section id="det" class="panel"></section>
        <section class="panel">
            <h2>Avaliações</h2>
            <div id="reviews"></div>
        </section>
        <section class="panel">
            <h2>Avaliar este livro</h2>
            <div class="form-grid"><select id="aluno"></select><select id="nota">
                    <option value="5">★★★★★ 5</option>
                    <option value="4">★★★★☆ 4</option>
                    <option value="3">★★★☆☆ 3</option>
                    <option value="2">★★☆☆☆ 2</option>
                    <option value="1">★☆☆☆☆ 1</option>
                </select><textarea class="full" id="comentario" placeholder="Escreva sua avaliação"></textarea><button
                    id="enviar">Publicar avaliação</button></div>
        </section>
    </main>
    <script src="js/common.js"></script>
    <script src="js/livro-detalhe.js"></script>
</body>

</html>
